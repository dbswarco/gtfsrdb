services:
  postgres:
    image: postgis/postgis
    restart: unless-stopped
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: ott
      POSTGRES_USER: ott
      POSTGRES_DB: ott
    ports:
      - 5432:5432
    networks:
      dcbr:
        ipv4_address: 10.5.0.2

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080
    networks:
      dcbr:
        ipv4_address: 10.5.0.3

  gtfsrdb-mbta:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gtfsrdb-mbta
    restart: unless-stopped
    environment:
      # Set your timezone
      - TZ=America/Detroit
    command:
      # Run command - customize with your actual URLs and database connection
      - --database=postgresql+psycopg2://ott:ott@ubuntudocker-vm:5432/mbta
      - --wait=1
      - --vehicle-positions=https://cdn.mbta.com/realtime/VehiclePositions.pb
      - --trip-updates=https://cdn.mbta.com/realtime/TripUpdates.pb
      - --verbose
      - --create-tables
    volumes:
      # Mount a volume for CSV output if using --print-positions
      - ./data:/app/data
    # depends_on:
    #  - postgres
    networks:
      - dcbr
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  dcbr:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.1